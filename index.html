<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Esquiva Hoyos">
<meta name="theme-color" content="#20262e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Esquiva Hoyos</title>
<style>
  html,body{margin:0;height:100%;background:#20262e;display:flex;align-items:center;justify-content:center;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  body{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  canvas{background:#6c7a89;border-radius:8px;touch-action:none;height:auto;flex:none;
    width:min(100vw, 100vh * 2 / 3);
    width:min(calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right)),
              calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 2 / 3))}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script src="data.js"></script>
<script>
// ====== ESQUIVA HOYOS — Maipú real: calles de OpenStreetMap, eventos de fuentes oficiales y prensa local ======
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, TAU = Math.PI * 2;
const M = window.MAIPU;
const PXM = 13;          // píxeles por metro (dibujo)
const K = 7;             // 1 m dibujado = K m de recorrido real (para que una ruta de 5 km dure ~1 minuto)
const LW = 3.4;          // ancho de pista (m)
const PY = H - 170;      // posición vertical del jugador en pantalla
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt$ = n => '$' + Math.round(n).toLocaleString('es-CL');
const store = { get(k, d){ try { const v = localStorage.getItem('eh_' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
                set(k, v){ try { localStorage.setItem('eh_' + k, JSON.stringify(v)); } catch(e){} } };

// ---------- Vehículos ----------
const VEH = [
  { id:'auto',      n:'AUTO',      desc:'Equilibrado. El de todos los días.',      len:4.4, wid:1.8, vmax:70, acc:16, steer:7,  hp:4, hoyo:1,   agua:0.5, col:'#ffcf3f' },
  { id:'moto',      n:'MOTO',      desc:'Rápida y ágil, pero sufre con agua y hoyos.', len:2.1, wid:0.8, vmax:80, acc:22, steer:10, hp:2, hoyo:1.5, agua:1,   col:'#ff5d5d' },
  { id:'micro',     n:'MICRO',     desc:'Lenta y enorme, aguanta todo.',           len:11,  wid:2.6, vmax:55, acc:8,  steer:4.5,hp:7, hoyo:0.5, agua:0.2, col:'#e8414c' },
  { id:'colectivo', n:'COLECTIVO', desc:'Rápido y con letrero. Sabe atajos.',      len:4.6, wid:1.8, vmax:75, acc:15, steer:7,  hp:3, hoyo:1,   agua:0.5, col:'#1e1e1e' },
  { id:'bici',      n:'BICICLETA', desc:'Lenta, chiquitita y muy frágil.',         len:1.8, wid:0.7, vmax:32, acc:10, steer:9,  hp:2, hoyo:1.5, agua:1,   col:'#3fb6ff', prog:2 },
];

// ---------- Sonido (sintetizado; respeta el interruptor de silencio del iPhone) ----------
const SFX = (() => {
  let ac = null, master, noiseBuf, eng, engG, rainG, on = store.get('snd', true);
  const last = {};
  function kick(){
    try { const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0); } catch(e){}
    if (ac.state !== 'running'){ const p = ac.resume(); if (p && p.catch) p.catch(() => {}); }
  }
  function init(){
    if (ac){ if (ac.state !== 'running') kick(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = on ? 0.6 : 0; master.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // motor: diente de sierra filtrado
    eng = ac.createOscillator(); eng.type = 'sawtooth'; eng.frequency.value = 40;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    engG = ac.createGain(); engG.gain.value = 0; eng.connect(f); f.connect(engG); engG.connect(master); eng.start();
    // lluvia: ruido continuo
    const rs = ac.createBufferSource(); rs.buffer = noiseBuf; rs.loop = true;
    const rf = ac.createBiquadFilter(); rf.type = 'highpass'; rf.frequency.value = 2500;
    rainG = ac.createGain(); rainG.gain.value = 0; rs.connect(rf); rf.connect(rainG); rainG.connect(master); rs.start();
    kick();
  }
  const ready = () => ac && on && ac.state === 'running';
  function ok(n, gap){ if (!ready()) return false; const t = ac.currentTime; if (t - (last[n] ?? -9) < gap) return false; last[n] = t; return true; }
  function tone(type, f0, f1, dur, vol, at = 0){
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, f0, f1, type = 'lowpass', at = 0){
    const t = ac.currentTime + at, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  }
  const seq = (notes, step, len, vol, type = 'square') => notes.forEach((m, i) => tone(type, 440 * 2 ** ((m - 69) / 12), 0, len, vol, i * step));
  return {
    init, get on(){ return on; },
    toggle(){ on = !on; store.set('snd', on); if (on) init(); if (ac) master.gain.setTargetAtTime(on ? 0.6 : 0, ac.currentTime, 0.02); },
    suspend(){ if (ac) ac.suspend(); },
    engine(kmh, active, veh){ if (!ac) return; const t = ac.currentTime;
      const base = veh === 'micro' ? 28 : veh === 'moto' ? 70 : veh === 'bici' ? 0 : 45;
      engG.gain.setTargetAtTime(active && base ? 0.07 : 0, t, 0.1);
      eng.frequency.setTargetAtTime(base + kmh * (veh === 'moto' ? 2.2 : 1.3), t, 0.1); },
    rain(onr){ if (ac) rainG.gain.setTargetAtTime(onr ? 0.05 : 0, ac.currentTime, 0.3); },
    plop(){ if (ok('plop', 0.15)){ tone('sine', 160, 50, 0.25, 0.5); noise(0.2, 0.3, 800, 100); seq([67, 60], 0.08, 0.1, 0.05); } },
    crash(){ if (ok('crash', 0.2)){ noise(0.6, 0.6, 3000, 200); tone('square', 200, 60, 0.3, 0.12); } },
    splash(){ if (ok('spl', 0.3)) noise(0.6, 0.35, 1800, 300, 'bandpass'); },
    horn(){ if (ok('horn', 0.6)){ tone('square', 392, 0, 0.18, 0.06); tone('square', 494, 0, 0.18, 0.05); } },
    whistle(){ if (ok('wh', 0.8)){ tone('sine', 2600, 2400, 0.15, 0.12); tone('sine', 2600, 2300, 0.35, 0.12, 0.2); } },
    phew(){ if (ok('phew', 0.25)) tone('triangle', 900, 1400, 0.08, 0.05); },
    alarm(){ if (ok('al', 1.2)) for (let i = 0; i < 3; i++) tone('sawtooth', 520, 900, 0.2, 0.06, i * 0.25); },
    robbed(){ if (ok('rob', 1)) seq([64, 63, 62, 61, 52], 0.12, 0.2, 0.08, 'sawtooth'); },
    win(){ if (ok('win', 1)) seq([60, 64, 67, 72, 76, 79, 84], 0.1, 0.18, 0.07); },
    lose(){ if (ok('lose', 1)) seq([67, 64, 60, 55, 48], 0.2, 0.3, 0.12, 'triangle'); },
    click(){ if (ok('cl', 0.05)) tone('square', 660, 990, 0.06, 0.05); },
    coin(){ if (ok('coin', 0.1)) seq([84, 88], 0.06, 0.08, 0.05); },
  };
})();

// ---------- Entrada ----------
const keys = {};
let touchX = null, braking = false, touches = 0;
addEventListener('keydown', e => {
  SFX.init(); keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyM' && !e.repeat) SFX.toggle();
  onKey(e.code);
});
addEventListener('keyup', e => keys[e.code] = false);
function tp(t){ const r = cv.getBoundingClientRect(); return { x:(t.clientX - r.left) * W / r.width, y:(t.clientY - r.top) * H / r.height }; }
const BRAKE_BTN = { x:W - 70, y:H - 70, r:52 };
function updTouches(e){
  touches = e.touches.length; braking = false; touchX = null;
  for (const t of e.touches){ const p = tp(t);
    if (Math.hypot(p.x - BRAKE_BTN.x, p.y - BRAKE_BTN.y) < BRAKE_BTN.r + 10) braking = true; else touchX = p.x; }
}
cv.addEventListener('touchstart', e => { e.preventDefault(); SFX.init();
  const p = tp(e.changedTouches[0]);
  if (scene !== 'drive' || paused) tap(p); else { if (inBtn(p, GAME_SND)) { tapSound(); return; } updTouches(e); }
}, { passive:false });
cv.addEventListener('touchmove', e => { e.preventDefault(); if (scene === 'drive') updTouches(e); }, { passive:false });
cv.addEventListener('touchend', e => { SFX.init(); if (scene === 'drive') updTouches(e); });
cv.addEventListener('mousedown', e => { SFX.init(); const p = tp(e); if (scene !== 'drive' || paused) tap(p); else if (inBtn(p, GAME_SND)) tapSound(); });
for (const ev of ['touchend','pointerup','click']) document.addEventListener(ev, () => SFX.init(), { capture:true, passive:true });
document.addEventListener('visibilitychange', () => { if (document.hidden){ if (scene === 'drive') paused = true; SFX.suspend(); } });

// ---------- Estado general ----------
let scene = 'title', paused = false, T = 0;
let vsel = store.get('veh', 0), clima = store.get('clima', 'auto'), hora = store.get('hora', 'ahora');
let rsel = 0, endless = false;
const best = store.get('best', {});
const CLIMAS = { auto:'Al azar', sol:'Soleado', lluvia:'Lluvia' }, HORAS = { ahora:'Hora real', dia:'Día', noche:'Noche' };
let buttons = [];   // botones de la escena actual: {x,y,w,h,fn}
const btn = (x, y, w, h, fn) => buttons.push({ x, y, w, h, fn });
function tap(p){
  if (scene === 'drive' && paused){ paused = false; return; }
  for (const b of buttons) if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h){ b.fn(); SFX.click(); return; }
}
function onKey(c){
  if (scene === 'title'){
    if (c === 'ArrowLeft') { vsel = (vsel + VEH.length - 1) % VEH.length; store.set('veh', vsel); SFX.click(); }
    if (c === 'ArrowRight'){ vsel = (vsel + 1) % VEH.length; store.set('veh', vsel); SFX.click(); }
    if (c === 'Enter' || c === 'Space') { scene = 'map'; SFX.click(); }
  } else if (scene === 'map'){
    const n = M.routes.length + 1;
    if (c === 'ArrowUp' || c === 'ArrowLeft')  { rsel = (rsel + n - 1) % n; SFX.click(); }
    if (c === 'ArrowDown' || c === 'ArrowRight'){ rsel = (rsel + 1) % n; SFX.click(); }
    if (c === 'Enter' || c === 'Space') startSelected();
    if (c === 'Escape') scene = 'title';
  } else if (scene === 'drive'){
    if (c === 'KeyP' || c === 'Escape') paused = !paused;
  } else if (scene === 'end'){
    if (c === 'Enter' || c === 'Space') scene = 'map';
  }
}

// ---------- Botón de sonido (carita, como en Dispara XD) ----------
const MENU_SND = { x:W - 82, y:30, w:144, h:34 }, GAME_SND = { x:W - 50, y:122, w:84, h:22 };
const inBtn = (p, b) => Math.abs(p.x - b.x) < b.w / 2 + 8 && Math.abs(p.y - b.y) < b.h / 2 + 8;
let sndPop = 0;
function tapSound(){ SFX.toggle(); SFX.click(); sndPop = 0.25; }
function drawSoundBtn(b){
  const on = SFX.on, k = b.h / 38, r = b.h * 0.36, fx = -b.w / 2 + b.h / 2, pop = 1 + Math.max(0, sndPop) * 1.2;
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.sin(T * (on ? 5 : 1.5)) * (on ? 0.05 : 0.03)); ctx.scale(pop, pop);
  ol(2.5 * k); ctx.fillStyle = on ? '#ff8a00' : '#5c677d'; rr(-b.w / 2, -b.h / 2, b.w, b.h, b.h / 2);
  const bob = on ? Math.sin(T * 10) * 1.5 * k : 0;
  ctx.fillStyle = '#ffe14d'; ol(2 * k); ell(fx, bob, r, r);
  ctx.fillStyle = '#222'; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.8 * k;
  if (on){ ell(fx - r * 0.35, bob - r * 0.25, 1.8 * k, 2.4 * k, 1); ell(fx + r * 0.35, bob - r * 0.25, 1.8 * k, 2.4 * k, 1);
    ctx.fillStyle = '#c0392b'; ell(fx, bob + r * 0.38, 3.2 * k, (2.5 + Math.abs(Math.sin(T * 8)) * 3) * k * 0.8, 1); }
  else { for (const s of [-1, 1]){ ctx.beginPath(); ctx.arc(fx + s * r * 0.35, -r * 0.2, 2.6 * k, 0.2, Math.PI - 0.2); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(fx - r * 0.45, r * 0.4); ctx.lineTo(fx + r * 0.45, r * 0.4); ctx.stroke(); }
  ctx.font = `900 ${Math.round(13 * k)}px "Arial Black", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 2; i++){ const ph = (T * (on ? 1.2 : 0.6) + i * 0.5) % 1; ctx.globalAlpha = 1 - ph; ctx.fillStyle = '#fff';
    ctx.fillText(on ? (i ? '♫' : '♪') : (i ? 'Z' : 'z'), fx + r * 0.9 + ph * 8 * k, -r * 0.6 - ph * 14 * k); }
  ctx.globalAlpha = 1;
  txt(on ? 'SIN SONIDO' : 'CON SONIDO', fx + r + (b.w / 2 - fx - r) / 2 + 1, 1, Math.round(13 * k), '#fff');
  ctx.restore();
}

// ---------- Utilidades de dibujo ----------
function ol(w = 2.5){ ctx.strokeStyle = '#222'; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function ell(x, y, rx, ry, noStroke){ ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); ctx.fill(); if (!noStroke) ctx.stroke(); }
function rr(x, y, w, h, r, noStroke){ r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); ctx.fill(); if (!noStroke) ctx.stroke(); }
function txt(s, x, y, size, fill = '#ffe14d', align = 'center', stroke = true){
  ctx.font = `900 ${size}px "Arial Black", Impact, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke){ ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = '#222'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function fitTxt(s, x, y, size, maxW, fill, align){ ctx.font = `900 ${size}px "Arial Black", Impact, sans-serif`;
  while (size > 8 && ctx.measureText(s).width > maxW){ size--; ctx.font = `900 ${size}px "Arial Black", Impact, sans-serif`; }
  txt(s, x, y, size, fill, align); }
// letrero de calle chileno (verde con borde blanco)
function streetSign(s, x, y, size = 14, maxW = 300){
  ctx.font = `800 ${size}px Arial, sans-serif`; let w = Math.min(maxW, ctx.measureText(s).width + 18);
  while (size > 8 && ctx.measureText(s).width + 18 > maxW){ size--; ctx.font = `800 ${size}px Arial, sans-serif`; w = Math.min(maxW, ctx.measureText(s).width + 18); }
  const h = size + 12;
  ctx.fillStyle = '#0f6b3a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; rr(x - w / 2, y - h / 2, w, h, 4); ctx.stroke();
  ctx.strokeStyle = '#123'; ctx.lineWidth = 1; rr(x - w / 2 - 1.5, y - h / 2 - 1.5, w + 3, h + 3, 5, 0); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y + 1);
}

// ---------- Vehículos (vista desde arriba, caricatura) ----------
function drawVehicle(id, x, y, len, wid, col, opt = {}){
  const L = len * PXM, Wd = wid * PXM;
  ctx.save(); ctx.translate(x, y); if (opt.rot) ctx.rotate(opt.rot);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(-Wd / 2 + 3, -L / 2 + 5, Wd, L, Wd * 0.3, 1);
  ol(2);
  if (id === 'moto' || id === 'bici'){
    ctx.fillStyle = '#222'; rr(-Wd * 0.18, -L / 2, Wd * 0.36, L * 0.28, 3); rr(-Wd * 0.18, L / 2 - L * 0.28, Wd * 0.36, L * 0.28, 3); // ruedas
    ctx.fillStyle = col; rr(-Wd * 0.32, -L * 0.25, Wd * 0.64, L * 0.5, 4);
    ctx.fillStyle = id === 'bici' ? '#ffd23f' : '#fff'; ell(0, L * 0.02, Wd * 0.62, Wd * 0.62);                               // casco
    ctx.fillStyle = '#222'; ctx.fillRect(-Wd * 0.7, -L * 0.28, Wd * 1.4, 3);                                                   // manubrio
  } else {
    ctx.fillStyle = '#222'; for (const sx of [-1, 1]) for (const sy of [-1, 1]) rr(sx * Wd / 2 - 3, sy * L * 0.3 - 6, 6, 12, 2, 1);
    ctx.fillStyle = col; rr(-Wd / 2, -L / 2, Wd, L, id === 'micro' ? 6 : Wd * 0.35);
    if (id === 'micro'){
      ctx.fillStyle = '#fff'; ctx.fillRect(-Wd / 2 + 2, -L / 2 + L * 0.12, Wd - 4, L * 0.08);
      ctx.fillStyle = '#9fd8ff'; rr(-Wd / 2 + 4, -L / 2 + 4, Wd - 8, L * 0.08, 3);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; for (let i = 0; i < 3; i++) rr(-Wd / 2 + 6, -L / 2 + L * (0.3 + i * 0.2), Wd - 12, L * 0.12, 3, 1);
    } else {
      ctx.fillStyle = '#9fd8ff'; rr(-Wd / 2 + 4, -L * 0.24, Wd - 8, L * 0.18, 4);              // parabrisas
      ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(-Wd / 2 + 5, -L * 0.04, Wd - 10, L * 0.3, 4, 1);    // techo
      ctx.fillStyle = '#9fd8ff'; rr(-Wd / 2 + 5, L * 0.28, Wd - 10, L * 0.1, 3);               // luneta
      if (id === 'colectivo'){ ctx.fillStyle = '#ffd23f'; rr(-Wd * 0.38, L * 0.02, Wd * 0.76, L * 0.12, 3);
        ctx.fillStyle = '#222'; ctx.font = '900 7px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('COLECT.', 0, L * 0.08); }
      if (id === 'camion'){ ctx.fillStyle = '#ddd'; rr(-Wd / 2 + 1, -L * 0.05, Wd - 2, L * 0.55, 3); }
    }
    ctx.fillStyle = opt.night ? '#fff8c0' : '#fff6d5'; ell(-Wd * 0.3, -L / 2 + 3, 3, 2.5, 1); ell(Wd * 0.3, -L / 2 + 3, 3, 2.5, 1);
    ctx.fillStyle = opt.brake ? '#ff2a2a' : '#a01818'; ell(-Wd * 0.32, L / 2 - 2, 3, 2, 1); ell(Wd * 0.32, L / 2 - 2, 3, 2, 1);
  }
  ctx.restore();
}

// ---------- Ruta: utilidades sobre los datos reales ----------
function segAt(R, d){ for (const s of R.segs) if (d < s.d1) return s; return R.segs[R.segs.length - 1]; }
const lanesAt = (R, d) => segAt(R, d).lanes;
function makeRng(seed){ let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ---------- Partida ----------
let G = null;
function startSelected(){
  if (rsel >= M.routes.length){ endless = true; startRoute(Math.floor(Math.random() * M.routes.length), 0); }
  else { endless = false; startRoute(rsel, 0); }
}
function resolveEnv(R){
  const h = new Date().getHours();
  const night = R.night || hora === 'noche' || (hora === 'ahora' && (h >= 20 || h < 7));
  const rain = clima === 'lluvia' || (clima === 'auto' && Math.random() < 0.35);
  const rush = hora === 'ahora' && ((h >= 7 && h < 10) || (h >= 18 && h < 21));
  return { night, rain, rush };
}
function startRoute(i, lap){
  const R = M.routes[i], V = VEH[vsel], env = resolveEnv(R), rng = makeRng(i * 977 + 13 + lap * 31);
  const ev = [];
  // eventos reales de la ruta
  for (const e of R.events){
    if (e.type === 'anegamiento' && !env.rain) continue;
    if (e.type === 'zona' && !env.night) continue;
    ev.push(Object.assign({ real:true, lane: e.lane ?? Math.floor(rng() * 2) }, e));
  }
  // eventos simulados (hoyos genéricos, charcos con lluvia, semáforos en cruces grandes)
  const diffK = 1 + lap * 0.25;
  for (let d = 350; d < R.len - 200; d += (140 + rng() * 260) / diffK){
    const seg = segAt(R, d), dens = seg.cls >= 4 ? 1 : seg.cls >= 3 ? 0.75 : 0.55;
    if (rng() < dens) ev.push({ type:'hoyo', d, lane: Math.floor(rng() * seg.lanes), off: rng() - 0.5, size: 0.8 + rng() * 0.8 });
  }

    ctx.font = '600 10px Arial'; ctx.fillStyle = '#cdd'; ctx.textAlign = 'left'; ctx.fillText(it.s.length > 62 ? it.s.slice(0, 60) + '…' : it.s, 32, y + ih * 0.72);
    const b = it.i < M.routes.length ? best['r' + it.i] : null;
    if (b) txt('★'.repeat(b.stars) + '☆'.repeat(3 - b.stars), W - 22, y + ih * 0.4, 13, '#ffe14d', 'right');
    else if (it.i === M.routes.length && best.endless) txt(String(best.endless), W - 22, y + ih * 0.4, 12, '#ffe14d', 'right');
    btn(12, y, W - 24, ih - 4, () => { if (rsel === it.i) startSelected(); else rsel = it.i; });
  });
  ctx.fillStyle = '#ff8a00'; ol(3); rr(W / 2 + 10, H - 56, W / 2 - 22, 44, 22); txt('¡A MANEJAR! ▶', W * 0.75 - 1, H - 34, 17, '#fff');
  btn(W / 2 + 10, H - 56, W / 2 - 22, 44, startSelected);
  ctx.fillStyle = '#5c677d'; ol(3); rr(12, H - 56, W / 2 - 34, 44, 22); txt('◀ VEHÍCULO', W / 4 - 11, H - 34, 15, '#fff');
  btn(12, H - 56, W / 2 - 34, 44, () => { scene = 'title'; });
}

// ---------- Resultado ----------
function drawEnd(){
  buttons = [];
  const g = G;
  ctx.fillStyle = '#1d2733'; ctx.fillRect(0, 0, W, H);
  txt(g.ok ? '¡LLEGASTE!' : 'FIN DEL VIAJE', W / 2, 80, 44, g.ok ? '#7dffb0' : '#ff6a3d');
  if (!g.ok && g.why) txt(g.why, W / 2, 124, 16, '#fff');
  if (g.ok) txt('★'.repeat(g.stars) + '☆'.repeat(3 - g.stars), W / 2, 130, 36, '#ffe14d');
  streetSign(g.R.from + ' → ' + g.R.to, W / 2, 176, 13, W - 40);
  const rows = [['Hoyos que pisaste', g.stats.hoyos], ['Hoyos esquivados', g.stats.esquivados], ['Choques', g.stats.choques], ['Partes (luz roja)', g.stats.partes],
    ['Portonazos', g.stats.robos], ['Charcos y anegamientos', g.stats.agua], ['Gastos en reparaciones', fmt$(g.money)], ['PUNTAJE', g.final]];
  rows.forEach(([a, b], i) => { const y = 228 + i * 40; ctx.fillStyle = i === rows.length - 1 ? 'rgba(255,225,77,.15)' : 'rgba(255,255,255,.06)'; ol(1.5); rr(40, y - 16, W - 80, 32, 8);
    txt(a, 54, y, 14, '#fff', 'left'); txt(String(b), W - 54, y, 16, i === rows.length - 1 ? '#ffe14d' : '#8fd6ff', 'right'); });
  ctx.font = '600 11px Arial'; ctx.fillStyle = '#aab'; ctx.textAlign = 'center';
  ctx.fillText('★ sin pisar hoyos · ★ sin choques · ★ sin partes ni portonazos', W / 2, 568);
  ctx.fillStyle = '#ff8a00'; ol(3); rr(W / 2 - 120, 600, 240, 48, 24); txt('OTRA RUTA ▶', W / 2, 625, 20, '#fff');
  btn(W / 2 - 120, 600, 240, 48, () => { scene = 'map'; });
  ctx.fillStyle = '#5c677d'; ol(3); rr(W / 2 - 100, 660, 200, 40, 20); txt('REPETIR', W / 2, 681, 16, '#fff');
  btn(W / 2 - 100, 660, 200, 40, () => { endless ? startSelected() : startRoute(g.ri, 0); });
}

// ---------- Bucle ----------
let last = performance.now();
let lastErr = null;
function loop(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  try {
    update(dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    if (scene === 'title') drawTitle();
    else if (scene === 'map') drawMap();
    else if (scene === 'drive') drawDrive();
    else if (scene === 'end') drawEnd();
  } catch (e) {
    // Si algo falla, mostrarlo en pantalla (útil para depurar en el teléfono) en vez de congelar el juego.
    if (!lastErr) console.error(e);
    lastErr = (e && e.message) || String(e);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, H - 40, W, 40);
    ctx.font = '700 11px Arial'; ctx.fillStyle = '#ff8fa3'; ctx.textAlign = 'left'; ctx.fillText('Error: ' + lastErr.slice(0, 80), 8, H - 16);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
