// ---------- Red de calles (OpenStreetMap, con sentido real) ----------
const NN = D.N.length / 2, NX = new Float64Array(NN), NY = new Float64Array(NN);
for (let i = 0; i < NN; i++){ NX[i] = D.N[2 * i]; NY[i] = D.N[2 * i + 1]; }
const PEN = [1, 1, 1, 1.05, 1.1, 1.3, 1.6];
const ED = D.E.map((r, i) => {
  const [a, b, name, cls, lf, lb, v, ow] = r, mid = D.P[i];
  const pts = [[NX[a], NY[a]]];
  for (let k = 0; k < mid.length; k += 2) pts.push([mid[k], mid[k + 1]]);
  pts.push([NX[b], NY[b]]);
  const cum = [0]; for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
  const hw = ow ? lf * LW / 2 : Math.max(lf, lb) * LW;
  // normales por vértice (para pintar líneas desplazadas)
  const nx = [], ny = [];
  for (let k = 0; k < pts.length; k++){
    const p = pts[Math.max(0, k - 1)], q = pts[Math.min(pts.length - 1, k + 1)];
    let dx = q[0] - p[0], dy = q[1] - p[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    nx.push(-dy); ny.push(dx);
  }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of pts){ x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  return { id:i, a, b, name:D.names[name], cls, lf, lb, v, ow:!!ow, pts, cum, len:cum[cum.length - 1], hw, lo:-hw, hi:hw, nx, ny, x0, y0, x1, y1 };
});
const NE = Array.from({ length:NN }, () => []);
const OUT = Array.from({ length:NN }, () => []);
for (const e of ED){
  NE[e.a].push(e.id); NE[e.b].push(e.id);
  const c = e.len * PEN[e.cls];
  OUT[e.a].push([e.id, e.b, 1, c]); if (!e.ow) OUT[e.b].push([e.id, e.a, -1, c]);
}
// grilla espacial
const CELL = 100, GRID = new Map();
const gk = (ix, iy) => (ix + 2000) * 8192 + (iy + 2000);
for (const e of ED){
  for (let ix = Math.floor((e.x0 - e.hw) / CELL); ix <= Math.floor((e.x1 + e.hw) / CELL); ix++)
    for (let iy = Math.floor((e.y0 - e.hw) / CELL); iy <= Math.floor((e.y1 + e.hw) / CELL); iy++){
      const k = gk(ix, iy); if (!GRID.has(k)) GRID.set(k, []); GRID.get(k).push(e.id);
    }
}
let stamp = 1; const STAMP = new Int32Array(ED.length);
function edgesIn(x0, y0, x1, y1){
  stamp++; const out = [];
  for (let ix = Math.floor(x0 / CELL); ix <= Math.floor(x1 / CELL); ix++)
    for (let iy = Math.floor(y0 / CELL); iy <= Math.floor(y1 / CELL); iy++){
      const l = GRID.get(gk(ix, iy)); if (!l) continue;
      for (const id of l) if (STAMP[id] !== stamp){ STAMP[id] = stamp; const e = ED[id]; if (e.x1 + e.hw >= x0 && e.x0 - e.hw <= x1 && e.y1 + e.hw >= y0 && e.y0 - e.hw <= y1) out.push(id); }
    }
  return out;
}
function segIdx(e, s){ const c = e.cum; let k = 0; const n = c.length - 2; while (k < n && c[k + 1] < s) k++; return k; }
function pointAt(e, s, off){
  s = clamp(s, 0, e.len); const k = segIdx(e, s), p = e.pts[k], q = e.pts[k + 1];
  const L = (e.cum[k + 1] - e.cum[k]) || 1e-6, u = (s - e.cum[k]) / L, dx = (q[0] - p[0]) / L, dy = (q[1] - p[1]) / L;
  return { x:p[0] + (q[0] - p[0]) * u - dy * off, y:p[1] + (q[1] - p[1]) * u + dx * off, dx, dy };
}
function leaveHeading(eid, n){ const e = ED[eid], P = e.pts, m = P.length;
  const [p, q] = e.a === n ? [P[0], P[1]] : [P[m - 1], P[m - 2]]; const L = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1; return [(q[0] - p[0]) / L, (q[1] - p[1]) / L]; }
function arriveHeading(eid, dir){ const e = ED[eid], P = e.pts, m = P.length;
  const [p, q] = dir > 0 ? [P[m - 2], P[m - 1]] : [P[1], P[0]]; const L = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1; return [(q[0] - p[0]) / L, (q[1] - p[1]) / L]; }
const nodeAhead = (eid, dir) => dir > 0 ? ED[eid].b : ED[eid].a;
// opciones al llegar al final del arco
function options(eid, dir){
  const n = nodeAhead(eid, dir), h = arriveHeading(eid, dir), list = [];
  for (const c of NE[n]){
    if (c === eid) continue;
    const lh = leaveHeading(c, n), rel = Math.atan2(h[0] * lh[1] - h[1] * lh[0], h[0] * lh[0] + h[1] * lh[1]);
    const cdir = ED[c].a === n ? 1 : -1;
    list.push({ e:c, dir:cdir, rel, wrong:ED[c].ow && cdir < 0 });
  }
  const cat = { L:null, S:null, R:null };
  for (const o of list){
    const k = o.rel < -0.6 ? 'L' : o.rel > 0.6 ? 'R' : 'S';
    const score = (k === 'S' ? Math.abs(o.rel) : Math.abs(Math.abs(o.rel) - Math.PI / 2)) + (o.wrong ? 0.8 : 0) + (ED[o.e].cls >= 6 ? 0.2 : 0);
    if (!cat[k] || score < cat[k].score) cat[k] = Object.assign({ score }, o);
  }
  return { n, list, cat };
}
// GPS (A*, respeta el sentido de las calles)
function route(from, goal){
  if (from === goal) return [];
  const g = new Float64Array(NN).fill(Infinity), pe = new Int32Array(NN).fill(-1), pd = new Int8Array(NN), pn = new Int32Array(NN).fill(-1), done = new Uint8Array(NN);
  const hx = NX[goal], hy = NY[goal], h = n => Math.hypot(NX[n] - hx, NY[n] - hy);
  const heap = [[h(from), from]]; g[from] = 0;
  const push = it => { heap.push(it); let i = heap.length - 1; while (i){ const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length){ heap[0] = last; let i = 0; for (;;){ const l = 2 * i + 1, r = l + 1; let m = i;
    if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  while (heap.length){
    const [, u] = pop(); if (done[u]) continue; done[u] = 1; if (u === goal) break;
    for (const [eid, v, dir, c] of OUT[u]){ const nd = g[u] + c; if (nd < g[v]){ g[v] = nd; pe[v] = eid; pd[v] = dir; pn[v] = u; push([nd + h(v), v]); } }
  }
  if (pe[goal] < 0) return null;
  const path = []; let n = goal; while (n !== from){ path.push({ e:pe[n], dir:pd[n] }); n = pn[n]; }
  return path.reverse();
}

// ---------- Sonido (sintetizado; respeta el interruptor de silencio del iPhone) ----------
const SFX = (() => {
  let ac = null, master, noiseBuf, eng, engG, rainG, sirG, sirO, on = store.get('snd', true);
  const last = {};
  function kick(){
    try { const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0); } catch(e){}
    if (ac.state !== 'running'){ const p = ac.resume(); if (p && p.catch) p.catch(() => {}); }
  }
  function init(){
    if (ac){ if (ac.state !== 'running') kick(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = on ? 0.6 : 0; master.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    eng = ac.createOscillator(); eng.type = 'sawtooth'; eng.frequency.value = 40;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    engG = ac.createGain(); engG.gain.value = 0; eng.connect(f); f.connect(engG); engG.connect(master); eng.start();
    const rs = ac.createBufferSource(); rs.buffer = noiseBuf; rs.loop = true;
    const rf = ac.createBiquadFilter(); rf.type = 'highpass'; rf.frequency.value = 2500;
    rainG = ac.createGain(); rainG.gain.value = 0; rs.connect(rf); rf.connect(rainG); rainG.connect(master); rs.start();
    // sirena: tono que sube y baja
    sirO = ac.createOscillator(); sirO.type = 'square'; sirO.frequency.value = 760;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.9; const lg = ac.createGain(); lg.gain.value = 260; lfo.connect(lg); lg.connect(sirO.frequency); lfo.start();
    const sf = ac.createBiquadFilter(); sf.type = 'lowpass'; sf.frequency.value = 1800;
    sirG = ac.createGain(); sirG.gain.value = 0; sirO.connect(sf); sf.connect(sirG); sirG.connect(master); sirO.start();
    kick();
  }
  const ready = () => ac && on && ac.state === 'running';
  function ok(n, gap){ if (!ready()) return false; const t = ac.currentTime; if (t - (last[n] ?? -9) < gap) return false; last[n] = t; return true; }
  function tone(type, f0, f1, dur, vol, at = 0){
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);

  }
  function noise(dur, vol, f0, f1, type = 'lowpass', at = 0){
    const t = ac.currentTime + at, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  }
  const seq = (notes, step, len, vol, type = 'square') => notes.forEach((m, i) => tone(type, 440 * 2 ** ((m - 69) / 12), 0, len, vol, i * step));
  return {
    init, get on(){ return on; },
    toggle(){ on = !on; store.set('snd', on); if (on) init(); if (ac) master.gain.setTargetAtTime(on ? 0.6 : 0, ac.currentTime, 0.02); },
    engine(kmh, active){ if (!ac) return; const t = ac.currentTime; engG.gain.setTargetAtTime(active ? 0.06 : 0, t, 0.1); eng.frequency.setTargetAtTime(45 + kmh * 1.3, t, 0.1); },

    meow(){ if (ok('meow', 0.4)){ tone('sawtooth', 600, 1100, 0.12, 0.05); tone('sawtooth', 1100, 500, 0.3, 0.05, 0.12); } },
    boing(){ if (ok('boing', 0.3)) tone('sine', 300, 900, 0.25, 0.12); },
    win(){ if (ok('win', 1)) seq([60, 64, 67, 72, 76, 79, 84], 0.1, 0.18, 0.07); },
    lose(){ if (ok('lose', 1)) seq([67, 64, 60, 55, 48], 0.2, 0.3, 0.12, 'triangle'); },
    click(){ if (ok('cl', 0.05)) tone('square', 660, 990, 0.06, 0.05); },
    coin(){ if (ok('coin', 0.06)) seq([84, 88], 0.06, 0.08, 0.05); },
    bark(){ if (ok('bark', 0.25)){ tone('square', 520, 260, 0.09, 0.07); tone('square', 560, 280, 0.09, 0.07, 0.14); } },
    cough(){ if (ok('cough', 0.6)){ noise(0.12, 0.25, 1200, 400, 'bandpass'); noise(0.12, 0.25, 1100, 400, 'bandpass', 0.18); } },
    jet(){ if (ok('jet', 0.9)) noise(1.1, 0.18, 3000, 1500, 'bandpass'); },
    dance(){ if (ok('dance', 2)) seq([72, 76, 79, 76, 72, 76, 79, 84], 0.12, 0.1, 0.05); },
    turbo(){ if (ok('tb', 0.5)) seq([60, 67, 72, 79], 0.05, 0.1, 0.06, 'sawtooth'); },
  };
})();

// ---------- Utilidades de dibujo ----------
function rr(x, y, w, h, r){ r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function font(size, w = 900){ ctx.font = `${w} ${size}px "Arial Black", "Arial Rounded MT Bold", Impact, sans-serif`; }
function txt(s, x, y, size, fill = '#ffe14d', align = 'center', stroke = true, maxW){
  font(size); if (maxW) while (size > 8 && ctx.measureText(s).width > maxW) font(--size);
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke){ ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = '#1a1a1a'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

function pointAhead(dist){

function updateTraffic(dt, run, hx, hy){
  const P = G.P, target = G.L.rush ? 26 : G.L.night ? 8 : 16;
  G.spawnT -= dt;
  if (G.cars.length < target && G.spawnT <= 0){
    G.spawnT = 0.15;

      const dir = e.ow ? 1 : (Math.random() < 0.5 ? 1 : -1), s = rnd(3, e.len - 3);

        G.cars.push({ e:id, s, dir, lane, lat, v, vt:v, len:T.len, wid:T.wid, kind:T.kind, col:pick(T.cols), x:p.x, y:p.y, ang:Math.atan2(p.dy * dir, p.dx * dir), stun:0 });

    }
  }

    // seguir al de adelante

    for (const o of G.cars.concat([{ e:P.e, s:P.s, dir:P.dir, lat:P.lat, v:P.v }])){
      if (o === c || o.e !== c.e || o.dir !== c.dir || Math.abs(o.lat - c.lat) > 2.2) continue;
      const ahead = (o.s - c.s) * c.dir;
      if (ahead > 0 && ahead < 16) want = Math.min(want, ahead < 8 ? o.v * 0.5 : o.v * 0.95);

      const e = ED[c.e], lanes = Math.max(1, nx.dir > 0 ? e.lf : e.lb); c.lane = Math.min(c.lane, lanes - 1);
      c.lat = e.ow ? -e.hw + (c.lane + 0.5) * LW : (c.lane + 0.5) * LW;
      c.vt = (Math.min(e.v, 60) / 3.6) * rnd(0.55, 0.85) * (G.L.rush ? 0.6 : 1);
    }
    if (c.dead) continue;
    const e = ED[c.e], p = pointAt(e, c.s, c.lat * c.dir);
    c.x += (p.x - c.x) * Math.min(1, dt * 10); c.y += (p.y - c.y) * Math.min(1, dt * 10);

  const hole = (x, y, r, a = 1) => { const g = n.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); n.fillStyle = g; n.beginPath(); n.arc(x, y, r, 0, TAU); n.fill(); };
  hole(W / 2, sy - 150, 190, 0.95); hole(W / 2, sy, 70, 0.8);
  for (const m of G.mayor || []){ const [x, y] = toScreen(m.x, m.y); hole(x, y, m.t === 'ampolleta' && m.lit ? 220 : 50, m.t === 'ampolleta' && m.lit ? 0.95 : 0.6); }
  const R = Math.hypot(W / 2, H) / CAM.z;
  for (const id of edgesIn(CAM.x - R, CAM.y - R, CAM.x + R, CAM.y + R)){ const e = ED[id]; if (e.cls > 4) continue;
    for (const nn of [e.a, e.b]){ if (NE[nn].length < 3) continue; const [x, y] = toScreen(NX[nn], NY[nn]); if (x > -60 && x < W + 60 && y > -60 && y < H + 60) hole(x, y, 9 * CAM.z, 0.55); } }
  for (const c of G.cars){ const [x, y] = toScreen(c.x, c.y); hole(x, y, 40, 0.5); }
  for (const c of G.cops){ const [x, y] = toScreen(c.x, c.y); hole(x, y, 60, 0.7); }
  ctx.drawImage(nightCv, 0, 0, W, H);
  for (const c of G.cops){ const [x, y] = toScreen(c.x, c.y); const f = Math.floor(G.time * 8) % 2;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 70); g.addColorStop(0, f ? 'rgba(255,40,40,.35)' : 'rgba(40,110,255,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 70, 0, TAU); ctx.fill(); }
}
const DROPS = Array.from({ length:110 }, () => ({ x:Math.random(), y:Math.random(), s:0.8 + Math.random() * 0.6 }));
function drawRain(){
  ctx.fillStyle = 'rgba(40,60,90,.18)'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(200,225,255,.55)'; ctx.lineWidth = 1.3; ctx.beginPath();

  ctx.stroke();
}
function fmtT(t){ const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`; }
function remaining(){ const P = G.P, e = ED[P.e]; let d = P.dir > 0 ? e.len - P.s : P.s; for (const o of G.gps) d += ED[o.e].len; return d; }

    const f = Math.floor(G.time * 4) % 2; ctx.fillStyle = f ? 'rgba(200,30,30,.9)' : 'rgba(30,70,200,.9)'; rr(W / 2 - 150, top + 132, 300, 28, 10); ctx.fill();
    txt(`🚨 ${c.name} a ${gap} m${c.state === 'blunder' ? ' (haciendo el loco)' : ''}`, W / 2, top + 146, 13, '#fff', 'center', false, 290); }
  // mensajes
  for (const g of G.msgs){ const u = g.t / g.life, sc = u < 0.15 ? 0.6 + u / 0.15 * 0.4 : 1; ctx.globalAlpha = u > 0.8 ? (1 - u) / 0.2 : 1;
    const y = H * 0.4 + g.dy; ctx.save(); ctx.translate(W / 2, y); ctx.scale(sc, sc); txt(g.s, 0, 0, g.size, g.col, 'center', true, W - 30);
    if (g.sub){ ctx.font = '700 13px Arial'; const ls = wrap(g.sub, W - 60, 13); ls.forEach((l, i) => { ctx.fillStyle = 'rgba(20,24,30,.75)'; const w = ctx.measureText(l).width + 14; rr(-w / 2, g.size / 2 + 6 + i * 19, w, 18, 6); ctx.fill(); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(l, 0, g.size / 2 + 15.5 + i * 19); }); }

  if (G.opts){

function drawPause(){

// ---------- Menús ----------
function menuBg(){
  const L = LV[0], a = menuT * 0.05;

}
function drawTitle(){
  UI = []; menuBg();

  ctx.save(); ctx.translate(W / 2, y0); ctx.rotate(Math.sin(t * 2) * 0.03);

function drawEnd(){
  UI = []; menuBg();

  ctx.fillStyle = 'rgba(25,30,38,.94)'; ctx.strokeStyle = ok ? '#7dff8a' : '#ff6b6b'; ctx.lineWidth = 3; rr(16, y0, W - 32, H - y0 - SAFE_B - 200, 18); ctx.fill(); ctx.stroke();

    y += 8; txt(fin, W / 2, y, 18, '#ffd23f', 'center', true, W - 60);
    y += 34; ctx.font = '800 13px Arial'; ctx.fillStyle = '#ffb347'; ctx.textAlign = 'center'; ctx.fillText('Alcalde Todonovic: "' + G.orgullo + '"', W / 2, y, W - 60);

    for (const l of wrap(G.why || '', W - 80, 18, 800)){ txt(l, W / 2, y, 18, '#fff', 'center', true); y += 28; }

  }

// ---------- Bucle ----------
let lastT = performance.now(), lastErr = null;
function frame(dt){
  update(dt);
  ctx.setTransform(KPX, 0, 0, KPX, 0, 0); ctx.globalAlpha = 1;
  if (scene === 'title') drawTitle();
  else if (scene === 'levels') drawLevels();
  else if (scene === 'intro') drawIntro();
  else if (scene === 'play') drawPlay();
  else if (scene === 'end') drawEnd();
}
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  try { frame(dt); }
  catch (e){
    if (!lastErr) console.error(e);
    lastErr = (e && e.message) || String(e);
    ctx.setTransform(KPX, 0, 0, KPX, 0, 0); ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, H - 40, W, 40);
    ctx.font = '700 11px Arial'; ctx.fillStyle = '#ff8fa3'; ctx.textAlign = 'left'; ctx.fillText('Error: ' + lastErr.slice(0, 80), 8, H - 16);
  }
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
window.EH = { get G(){ return G; }, startLevel, frame, update, hz:populate, get scene(){ return scene; }, ED, route };
